components:
  securitySchemes:
    bearer:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            code:
              type: "string"
            message:
              type: "string"
            details: {}
          required:
            - "code"
            - "message"
      required:
        - "error"
    Health:
      type: "object"
      properties:
        status:
          type: "string"
        checks:
          type: "object"
    LoginIn:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
      required:
        - "email"
        - "password"
    RefreshIn:
      type: "object"
      properties:
        refresh_token:
          type: "string"
      required:
        - "refresh_token"
    User:
      type: "object"
      properties:
        id:
          type: "integer"
        email:
          type: "string"
        role:
          type: "string"
          enum:
            - "donor"
            - "nurse"
            - "lab"
            - "bank"
            - "hospital"
            - "admin"
        full_name:
          type: "string"
        hospital_id:
          type: "integer"
          nullable: true
        donor_id:
          type: "integer"
          nullable: true
    Tokens:
      type: "object"
      properties:
        access_token:
          type: "string"
        refresh_token:
          type: "string"
        expires_at:
          type: "string"
          format: "date-time"
        user:
          "$ref": "#/components/schemas/User"
    HealthInfo:
      type: "object"
      properties:
        medications:
          type: "array"
          items:
            type: "string"
        conditions:
          type: "array"
          items:
            type: "string"
        notes:
          type: "string"
    DonorIn:
      type: "object"
      properties:
        first_name:
          type: "string"
        last_name:
          type: "string"
        sex:
          type: "string"
          enum:
            - "M"
            - "F"
        birth_date:
          type: "string"
          format: "date"
        abo:
          type: "string"
          enum:
            - "O"
            - "A"
            - "B"
            - "AB"
        rh_positive:
          type: "boolean"
        phone:
          type: "string"
        email:
          type: "string"
        health:
          "$ref": "#/components/schemas/HealthInfo"
      required:
        - "first_name"
        - "last_name"
        - "sex"
        - "birth_date"
        - "abo"
        - "rh_positive"
    Donor:
      type: "object"
      properties:
        id:
          type: "integer"
        donor_no:
          type: "string"
        first_name:
          type: "string"
        last_name:
          type: "string"
        sex:
          type: "string"
        birth_date:
          type: "string"
          format: "date"
        group:
          type: "string"
        phone:
          type: "string"
    DonorList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Donor"
        next_cursor:
          type: "integer"
          nullable: true
    EligibilityIn:
      type: "object"
      properties:
        donation_type:
          type: "string"
          enum:
            - "whole_blood"
            - "platelet_apheresis"
        at:
          type: "string"
          format: "date"
        measurements:
          type: "object"
          properties:
            hemoglobin:
              type: "number"
            weight_kg:
              type: "number"
        declarations:
          type: "array"
          items:
            type: "object"
            properties:
              code:
                type: "string"
              date:
                type: "string"
                format: "date"
    Decision:
      type: "object"
      properties:
        eligible:
          type: "boolean"
        reasons:
          type: "array"
          items:
            type: "object"
            properties:
              code:
                type: "string"
              message:
                type: "string"
              until:
                type: "string"
                format: "date-time"
              permanent:
                type: "boolean"
        next_eligible_at:
          type: "string"
          format: "date-time"
          nullable: true
        rule_version:
          type: "string"
    DeferralIn:
      type: "object"
      properties:
        reason_code:
          type: "string"
        starts_on:
          type: "string"
          format: "date"
        note:
          type: "string"
      required:
        - "reason_code"
    AppointmentIn:
      type: "object"
      properties:
        donor_id:
          type: "integer"
        scheduled_at:
          type: "string"
          format: "date-time"
        donation_type:
          type: "string"
      required:
        - "scheduled_at"
    Appointment:
      type: "object"
      properties:
        id:
          type: "integer"
        donor_id:
          type: "integer"
        scheduled_at:
          type: "string"
          format: "date-time"
        status:
          type: "string"
    DonationIn:
      type: "object"
      properties:
        donor_id:
          type: "integer"
        appointment_id:
          type: "integer"
        donation_type:
          type: "string"
        volume_ml:
          type: "integer"
        hemoglobin:
          type: "number"
        weight_kg:
          type: "number"
        declarations:
          type: "array"
          items:
            type: "object"
        collected_at:
          type: "string"
          format: "date-time"
      required:
        - "donor_id"
        - "volume_ml"
        - "hemoglobin"
        - "weight_kg"
    Donation:
      type: "object"
      properties:
        id:
          type: "integer"
        donor_id:
          type: "integer"
        donation_type:
          type: "string"
        collected_at:
          type: "string"
          format: "date-time"
