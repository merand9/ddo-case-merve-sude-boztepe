# Bu dosya scripts/gen_openapi.py ile üretilir.
openapi: "3.0.3"
info:
  title: "DamarBağış API"
  version: "1.0.0"
  description: "Kan bağış merkezi ve kan bankası stok sistemi. Tüm hatalar {\"error\":{\"code\",\"message\",\"details\"}} biçimindedir."
servers:
  - url: "http://localhost:8080"
security:
  - bearer: []
paths:
  "/health":
    get:
      tags:
        - "Sistem"
      summary: "Sağlık durumu (veritabanı dahil)"
      operationId: "get_health"
      security: []
      responses:
        "200":
          description: "Başarılı"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
  "/metrics":
    get:
      tags:
        - "Sistem"
      summary: "Prometheus metrikleri (text/plain)"
      operationId: "get_metrics"
      security: []
      responses:
        "200":
          description: "Başarılı"
          content:
            "text/plain":
              schema:
                type: "string"
  "/auth/login":
    post:
      tags:
        - "Kimlik"
      summary: "Giriş; access + refresh token"
      operationId: "post_auth_login"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginIn"
      responses:
        "200":
          description: "Başarılı"
          content:
            "application/json":
              schema:
