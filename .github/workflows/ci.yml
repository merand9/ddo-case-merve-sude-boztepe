name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: gofmt
        run: test -z "$(gofmt -s -l ./cmd ./internal)" || (gofmt -s -l ./cmd ./internal; exit 1)
      - uses: golangci/golangci-lint-action@v6
        with: { version: v1.62.2 }

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: damar
          POSTGRES_PASSWORD: damar
          POSTGRES_DB: damar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U damar" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://damar:damar@localhost:5432/damar_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Testler (birim + entegrasyon, -race)
        run: go test ./... -count=1 -race -coverprofile=coverage.out -covermode=atomic
      - name: Test sayısı
        run: echo "Toplam test fonksiyonu $(go test ./... -list . | grep -c '^Test')"
      - name: Kapsam raporu
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          echo "### Kapsam (domain paketleri)" >> "$GITHUB_STEP_SUMMARY"
          go test ./internal/domain/... -coverprofile=domain.out -covermode=atomic >/dev/null
          go tool cover -func=domain.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Domain kapsamı >= %70
        run: |
          pct=$(go tool cover -func=domain.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "domain kapsamı: $pct%"
          awk -v p="$pct" 'BEGIN { exit (p >= 70) ? 0 : 1 }'
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: "coverage.*" }

  images:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Go imajları
        run: |
          for c in api simulator verify; do
            docker build --build-arg CMD=$c -t damarbagis/$c:ci .
          done
      - name: Web imajı
        run: docker build -t damarbagis/web:ci ./web
      - name: İmaj boyutları
        run: docker images 'damarbagis/*' --format 'table {{.Repository}}\t{{.Size}}'

  e2e:
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v4
      - name: make verify (compose up + uçtan uca doğrulama)
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          docker compose --profile verify run --rm verify | tee verify.txt
          { echo "### make verify"; sed -n '/^| Kimlik/,$p' verify.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Loglar (hata halinde)
        if: failure()
        run: docker compose logs --tail=200
