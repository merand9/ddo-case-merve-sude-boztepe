server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip_static on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # API vekili: tarayıcı yalnızca localhost:3000 ile konuşur (CORS gerekmez).
    location ~ ^/(api|auth)/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }
    location ~ ^/(health|metrics|openapi\.yaml)$ {
        proxy_pass http://api:8080;
    }

    # Vite çıktısı içerik özetli dosya adları üretir: uzun süreli önbellek güvenli.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # İstemci tarafı yönlendirme (React Router): bilinmeyen yollar index.html'e düşer.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
