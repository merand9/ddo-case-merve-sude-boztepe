name: damarbagis

x-go-service: &go-service
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  env_file: .env
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100", "-c", "log_min_duration_statement=500"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Veritabanı host'a açılmaz; yalnızca compose ağından erişilir.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    <<: *go-service
    build: { context: ., args: { CMD: api } }
    image: damarbagis/api:local
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      HTTP_ADDR: ":8080"
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 25s

  simulator:
    <<: *go-service
    build: { context: ., args: { CMD: simulator } }
    image: damarbagis/simulator:local
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      API_URL: http://api:8080
    tmpfs: ["/tmp"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  web:
    build: ./web
    image: damarbagis/web:local
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports: ["3000:8080"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # make verify: tüm özellik ve zorlu görevleri uçtan uca dener (profil dışında başlatılmaz).
  verify:
    profiles: ["verify"]
    build: { context: ., args: { CMD: verify } }
    image: damarbagis/verify:local
    env_file: .env
    environment:
      API_URL: http://api:8080
      WEB_URL: http://web:8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      api: { condition: service_healthy }
      simulator: { condition: service_healthy }
      web: { condition: service_healthy }

volumes:
  pgdata:
